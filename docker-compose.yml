version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mindright-db
    environment:
      POSTGRES_USER: mindright
      POSTGRES_PASSWORD: mindright_local_dev
      POSTGRES_DB: mindright
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mindright-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindright"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: mindright-cache
    ports:
      - "6379:6379"
    networks:
      - mindright-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  mindright-network:
    driver: bridge
